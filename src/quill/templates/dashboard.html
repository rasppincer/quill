{% extends "base.html" %}
{% set active_page = "dashboard" %}
{% block title %}Quill — Pieces{% endblock %}

{% block content %}
<h2>Pieces</h2>

<div class="cards" id="stats"></div>

<div style="margin-bottom: 16px;">
    <button class="btn primary" onclick="showCreateModal()">+ New Piece</button>
</div>

<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Genre</th>
            <th>Stage</th>
            <th>Progress</th>
            <th>Updated</th>
            <th></th>
        </tr>
    </thead>
    <tbody id="pieces-table">
        <tr><td colspan="6" class="empty">Loading...</td></tr>
    </tbody>
</table>

<!-- Create Piece Modal -->
<div id="create-modal" style="display:none">
    <div class="modal-overlay">
        <div class="modal">
            <h3>New Piece</h3>
            <form id="create-form" onsubmit="createPiece(event)">
                <label>Title</label>
                <input type="text" id="f-title" required autofocus>

                <label>Genre</label>
                <select id="f-genre">
                    <option value="fiction">Fiction</option>
                    <option value="non-fiction">Non-Fiction</option>
                </select>

                <label>Type</label>
                <select id="f-type">
                    <option value="story">Story</option>
                    <option value="blog">Blog</option>
                    <option value="editorial">Editorial</option>
                    <option value="analysis">Analysis</option>
                    <option value="tutorial">Tutorial</option>
                    <option value="essay">Essay</option>
                </select>

                <label>Audience</label>
                <input type="text" id="f-audience" placeholder="e.g. PoE 2 gamers">

                <label>Tone</label>
                <input type="text" id="f-tone" placeholder="e.g. thriller, casual, academic">

                <label>Language</label>
                <select id="f-language">
                    <option value="en">English</option>
                    <option value="bg">Bulgarian</option>
                    <option value="mixed">Mixed</option>
                </select>

                <label>Target Length</label>
                <input type="text" id="f-length" placeholder="e.g. 5000-8000 words">

                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

<script src="{{ base }}/static/js/dashboard_view.js"></script>
{% endblock %}
